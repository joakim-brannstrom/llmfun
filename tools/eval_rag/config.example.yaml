# Minimal config for the eval_rag harness: local nomic embedder, no model servers.
# Copy to the directory you run rag_eval from (the harness resolves relative
# model paths against the CWD) and adjust modelPath to your gguf location.
# codeModels is required by readConfig but unused by the harness.
dataDir: /tmp/llmfun_eval/data
memoryArea: /tmp/llmfun_eval/memory
promptDir: /tmp/llmfun_eval/prompt
workArea: /tmp/llmfun_eval/workarea
agentPrompt: AGENT.md
warnIfNoApiKey: false

codeModels:
  - server:
      url: http://127.0.0.1:1234
      type: llamaCpp
      promptUrl: v1/completion
      chatUrl: v1/chat/completions
      slotUrl: slots
      embedUrl: v1/embeddings
      timeoutSeconds: 60
      verifySslCert: true
      maxRetries: 3
      backoffMs: 500
      apiKeyEnv: ""
    display: unused
    modelName: unused
    temp: 0.6
    contextSize: 128000
    maxTokens: -1

embedConfig:
  type: local
  modelName: nomic-embed-text-v2-moe
  modelPath: /workarea/nomic-embed-text-v2-moe.Q8_0.gguf
  dimensions: 768
  chunkSize: 512
  mode: cpu
  documentPrefix: "search_document: "
  queryPrefix: "search_query: "
