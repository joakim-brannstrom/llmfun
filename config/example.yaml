# Example llmfun configuration file.
#
# llmfun reads only YAML configuration files; the old JSON names are never
# read. YAML 1.1 quoting rules that apply in this file:
# - numeric-looking values must be quoted to stay strings ("0.5", "60");
# - empty strings must be written explicitly as "";
# - regexes are single-quoted (double-quoted YAML rejects lone backslashes);
# - @-leading values and scalars containing ': ' must be quoted.

dataDir: llmfun/data
memoryArea: llmfun/data/memory
promptDir: llmfun/config/prompt
workArea: llmfun/workarea
agentPrompt: AGENT.md
activeCodeModelIndex: 0
warnIfNoApiKey: true
noMemory: false

skillPathsUser: []
skillPathsSystem: []
maxManifestSkills: 200
maxAlwaysApplyTokens: 4000
disableSkills: false

consolidationInterval: 10

toolLimits:
  readFileMaxLines: 20
  editFileMaxLines: 80
  maxDirEntries: 50
  grepMaxResults: 1000
  maxSummaryLength: 200
  maxTopicLength: 100
  maxTopK: 20
  maxArgLength: 200

# tui:
#   # Maximum TUI width in terminal columns. 0 = unlimited (default).
#   # Values must be 0 or >= 40. On platforms whose terminals cap row width
#   # (e.g. physical 255), set this to that cap; the TUI then never writes a
#   # column at or beyond the cap (no line-wrap corruption). The area to the
#   # right of the TUI is never written and is terminal-managed (typically
#   # blank: ncurses clears the screen on first refresh / uses the alternate
#   # screen).
#   maxWidth: 255

sandboxConfig:
  maxOutputBytes: 1048576
  # Every value is a CLI argument string. "0.5" and "60" must stay quoted:
  # unquoted they would parse as decimal/integer and the config merger would
  # silently drop the whole defaultOptions map (incl. 06_network isolation).
  defaultOptions:
    00_subcommand: ["run"]
    01_cleanup: ["--rm"]
    02_user: ["--user", "1000:1000"]
    03_resources: ["--memory", "256m", "--cpus", "0.5"]
    04_tmpfs: ["--tmpfs", "/tmp:rw,noexec,nosuid,size=64m"]
    05_timeout: ["--stop-timeout", "60"]
    06_network: ["--network", "none"]
    entrypoint_shell: ["sh", "-c"]
  systemExecutionEnvironmentsFile: "execution_environments.yaml"
  userExecutionEnvironmentsFile: ""

ragPrimary:
  path: llmfun/data/rag.sqlite3
  description: Primary RAG database (read/write)

ragSecondary:
  user_knowledge:
    - path: /path/to/knowledge.sqlite3
      description: Read-only user collected knowledge base

toolFilter:
  include:
    - '.*'
  exclude: []
toolBroker:
  # Kill switch (default true): false treats every registered tool as
  # untagged (alwaysOn) and makes discovery inert.
  # enabled: true
  # Tools never hidden regardless of toolFilter (default: ["taskDone"]).
  # A tool that is neverHide AND carries tags warns at startup
  # (validateToolBrokerConfig)
  # since tagging it has no hiding effect anyway.
  # neverHideTools: [taskDone]
  # tag - human-readable description shown by listToolTags (unknown keys
  # warn at startup).
  toolTagDescriptions:
    workarea: "Files in the agent workarea: read/write/list/search."

ragFilter:
  include:
    - '.*\.txt'
    - '.*\.md'
    - '.*\.d'
    - '.*\.json'
    - '.*\.yaml'
  exclude:
    - '.*deprecated.*'
    - '.*\.git.*'

ragConfig:
  windowOverlapPercent: 50

codeModels:
  - server:
      url: http://127.0.0.1:1234
      type: llamaCpp
      promptUrl: v1/completion
      chatUrl: v1/chat/completions
      slotUrl: slots
      embedUrl: v1/embeddings
      timeoutSeconds: 3600
      httpVerbosity: 0
      verifySslCert: true
      maxRetries: 3
      backoffMs: 500
      jsonFields: '{"chat_template_kwargs": {"preserve_thinking": true, "enable_thinking": true, "reasoning_effort": "medium"}}'
      apiKeyEnv: ""
    display: x-high
    modelName: local-model-xyz-high-reason-15b
    temp: 0.6
    contextSize: 128000
    maxTokens: -1

# Nudge policy: global defaults (usually all you need)
# Model stopped generating without calling a tool (needMoreThinking).
nudges:
  keepReasoning:
    # enabled: false silences the kind entirely: no nudge is emitted, the
    # strike counter is untouched, and the prompt files are not loaded
    # (loop-safety backstops govern the turn).
    enabled: true
    # Soft-phase prompt files, resolved through promptDir (same as AGENT.md).
    # Strike s uses entry min(s, len)-1; the last entry repeats.
    softNudges: [NUDGE_KEEP_REASONING_SOFT.md]
    softStrikes: 2     # soft nudges on strikes 1..2; the hard phase starts at strike 3
    hardNudges: [NUDGE_KEEP_REASONING_HARD.md]
    # Final nudges before the turn fails (agentStuckInLoop). 0 = unlimited
    # (legacy: last hard nudge repeats; loop-safety backstop governs).
    hardStrikes: 1
  recovery:            # model asks to continue after a failed/interrupted turn
    enabled: true
    softNudges: [NUDGE_RECOVERY_SOFT.md]
    softStrikes: 2
    hardNudges: [NUDGE_RECOVERY_HARD.md]
    hardStrikes: 1
  compression:        # context-usage advisory (one-shot per compress cycle)
    enabled: true
    # Trigger fraction, in (0.0, 1.0). A value >= 0.9 only draws a config
    # warning: the one-shot nudge could then never fire (forced compression
    # takes over at 90% anyway).
    threshold: 0.8
    # Empty/omitted = the shipped NUDGE_COMPRESSION.md.
    prompt: NUDGE_COMPRESSION.md
  feedback:            # FeedbackEngine warnings after tool calls (gating only)
    enabled: true
    intervalSecs: 900  # seconds between feedback warnings
    minToolCalls: 50   # tool calls between feedback warnings

# Per-model override (inside a codeModels: entry) REPLACES the whole policy
# for that model (wholesale): restate every field the model should differ
# in — fields not restated fall back to struct defaults, NOT to the global
# policy above. Omit the block entirely to inherit the global policy.
#   codeModels:
#     - display: opus
#       modelName: claude-opus-4
#       server: { url: https://api.example.com }
#       nudges:
#         keepReasoning:
#           softStrikes: 1   # this model gets the hard nudge immediately
summaryModel:
  server:
    url: http://127.0.0.1:1234
    type: llamaCpp
    promptUrl: v1/completion
    chatUrl: v1/chat/completions
    slotUrl: slots
    embedUrl: v1/embeddings
    timeoutSeconds: 60
    httpVerbosity: 0
    verifySslCert: true
    maxRetries: 3
    backoffMs: 500
    apiKeyEnv: "env variable to read the API key from"
  name: summary-model
  prompt: SUMMARY.md
  temp: 0.3
  contextSize: 32768
  contextChunkSize: 32768
  maxTokens: 4096
  preserveThinking: false

visionModel:
  server:
    url: http://127.0.0.1:1234
    type: llamaCpp
    promptUrl: v1/completion
    chatUrl: v1/chat/completions
    slotUrl: slots
    embedUrl: v1/embeddings
    timeoutSeconds: 60
    httpVerbosity: 0
    verifySslCert: true
    maxRetries: 3
    backoffMs: 500
    apiKey: ""
  modelName: vision-model
  systemPrompt: ""
  temp: 0.3
  contextSize: 32768
  maxTokens: 4096
  timeoutSecs: 60

embedConfig:
  type: remote
  server:
    url: http://127.0.0.1:1234
    type: llamaCpp
    timeoutSeconds: 60
    httpVerbosity: 0
    verifySslCert: true
    maxRetries: 3
    backoffMs: 500
    apiKey: ""
  modelName: nomic-embed-text
  chunkSize: 512
  dimensions: 768
  nBatch: 512
  uBatch: 512
  cpuThreads: 0 # as many as there are cores
  cpuThreadsBatch: 0 # as many as there are cores
  queryPrefix: "search_query: "
  documentPrefix: "search_document: "
